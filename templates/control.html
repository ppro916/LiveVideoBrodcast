<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broadcast Control</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070a;color:#e6edf3;font-family:system-ui,sans-serif;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:#0d1117;border-bottom:1px solid #21262d;gap:10px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 9px;border-radius:10px;border:1px solid;margin-left:8px}
.ok{color:#3fb950;border-color:#238636;background:rgba(35,134,54,.12)}
.bad{color:#f85149;border-color:#da3633;background:rgba(218,54,51,.12)}
.warn{color:#d29922;border-color:#9e6a03;background:rgba(210,153,34,.12)}
.onair{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1px;color:#8b949e}
.onair b{color:#fff;background:#da3633;padding:3px 10px;border-radius:5px;font-family:monospace}
.chip{background:#161b22;border:1px solid #30363d;padding:3px 9px;border-radius:5px;font-size:11px;color:#8b949e;margin-left:6px}
.chip b{color:#e6edf3}
main{display:grid;grid-template-columns:190px 1fr 310px;height:calc(100vh - 41px)}
aside{background:#0d1117;border-right:1px solid #21262d;overflow-y:auto;padding:8px}
aside.r{border-right:none;border-left:1px solid #21262d}
aside h3{font-size:10px;color:#6e7681;letter-spacing:1px;margin:6px 4px}
.row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:5px;cursor:pointer;background:#161b22;border:1px solid transparent;margin-bottom:3px}
.row:hover{background:#1c2230}
.row.sel{border-color:#58a6ff}
.dot{width:9px;height:9px;border-radius:50%;background:#6e7681;flex-shrink:0}
.dot.online{background:#3fb950;box-shadow:0 0 6px #3fb95088}
.dot.offline{background:#f85149}
.rid{font-family:monospace;font-size:11px;font-weight:700}
.rnm{font-size:10px;color:#8b949e;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.livedot{color:#f85149;font-size:12px;animation:bp 1.1s infinite}
@keyframes bp{50%{opacity:.3}}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0;padding:8px;gap:8px}
.pgmwrap{position:relative;flex:1;min-height:0;background:#000;border:2px solid #238636;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pgmwrap video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000;display:block;z-index:1}
.pgmwrap .tag{position:absolute;top:8px;left:8px;background:#da3633;color:#fff;font:700 10px monospace;padding:3px 9px;border-radius:4px;letter-spacing:1px;z-index:6}
.pgmwrap .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#8b949e;font:13px monospace}
#adlayer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:4}
#adlayer video,#adlayer img{width:100%;height:100%;object-fit:contain}
.adtext{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6%;font-weight:800;font-size:clamp(20px,4.5vw,64px);line-height:1.15}
#sctile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05070a;color:#e6edf3;font:700 clamp(20px,4vw,56px) system-ui;letter-spacing:3px;z-index:4;text-align:center;padding:20px}
#bottomstack{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:0 10px 10px}
#bottomstack.pos-below_score #ftr{order:2}
#bottomstack.pos-below_score #lower{order:1}
#ftr{order:1;width:100%}
#lower{order:2;pointer-events:none}
.ticker{overflow:hidden;white-space:nowrap;font:700 13px system-ui;letter-spacing:1.5px;z-index:4}
.ticker .track{display:inline-block;padding:6px 18px;padding-left:100%}
.ticker.scroll .track{animation:tk linear infinite}
.ticker.static .track{padding-left:0;display:block;text-align:center;width:100%;box-sizing:border-box}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#hdr{position:absolute;top:0;left:0;right:0;z-index:4}
#logo{position:absolute;top:8px;right:10px;z-index:4;pointer-events:none}
#logo img{display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.lt{background:linear-gradient(90deg,#0b3d91 0%,#1f6feb 60%,rgba(31,111,235,0) 100%);padding:6px 14px;font:700 12px system-ui;letter-spacing:2px;color:#cfe3ff;display:inline-block;border-radius:4px 4px 0 0}
.lbody{background:rgba(5,7,10,.88);border-left:4px solid #f0b429;padding:8px 14px;border-radius:0 6px 6px 0;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.lbody .l1{font:800 22px system-ui}
.lbody .l2{font:600 15px system-ui;color:#9fb0c4}
.lbody .ln{font:600 13px system-ui;color:#f0b429}
.transport{display:flex;gap:7px;flex-wrap:wrap}
.transport button{flex:1;min-width:110px;padding:10px 12px;border:none;border-radius:6px;font:700 12px system-ui;letter-spacing:.5px;cursor:pointer;background:#21262d;color:#e6edf3}
.transport button:hover{opacity:.88}
.transport .go{background:#238636;color:#fff;font-size:14px}
.transport .dgr{background:#da3633;color:#fff}
.transport .blu{background:#1f6feb;color:#fff}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;height:150px;overflow-y:auto;flex-shrink:0}
.tile{position:relative;background:#000;border:1px solid #21262d;border-radius:6px;overflow:hidden;min-height:90px;cursor:pointer}
.tile.live{border-color:#238636}
.tile.sel{border-color:#58a6ff;box-shadow:0 0 0 2px #58a6ff55}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6e7681;font:10px monospace}
.tile .tl{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));font:10px monospace;padding:3px 6px;color:#c9d1d9}
.tabs{display:flex;gap:5px;margin-bottom:8px}
.tabs button{flex:1;padding:7px;border:1px solid #30363d;background:#161b22;color:#8b949e;font:700 11px system-ui;border-radius:5px;cursor:pointer}
.tabs button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.fld{margin-bottom:7px}
.fld label{display:block;font-size:10px;color:#6e7681;letter-spacing:.5px;margin-bottom:3px;text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;background:#0d1117;border:1px solid #30363d;border-radius:5px;color:#e6edf3;font:12px system-ui}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:#1f6feb}
.fld textarea{resize:vertical;min-height:52px;font-family:monospace}
.btn{padding:8px 12px;border:none;border-radius:5px;background:#238636;color:#fff;font:700 11px system-ui;cursor:pointer;letter-spacing:.5px}
.btn.sec{background:#30363d}.btn.blu{background:#1f6feb}.btn.dgr{background:#da3633}
.btn:hover{opacity:.88}
.adrow{display:flex;align-items:center;gap:6px;background:#161b22;border:1px solid #21262d;border-radius:5px;padding:6px 7px;margin-bottom:4px}
.adrow .adt{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adrow .adk{font:10px monospace;color:#6e7681}
.adrow button{padding:4px 7px;font:700 10px system-ui;border:none;border-radius:4px;background:#1f6feb;color:#fff;cursor:pointer}
.adrow button.dgr{background:#da3633}
#dbg{font:10px monospace;color:#6e7681;padding:3px 14px;background:#0a0d12;border-top:1px solid #21262d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none !important}
.sw{display:flex;align-items:center;gap:8px;font-size:11px;color:#8b949e;margin-bottom:8px}
</style></head><body>

<header>
  <div><b style="letter-spacing:1px;font-size:14px">BROADCAST CONTROL</b><span id="cn" class="badge warn">CONNECTING…</span></div>
  <div class="onair">ON AIR <b id="oans">—</b></div>
  <div>
    <span class="chip"><b id="ct">0</b> cameras</span>
    <span class="chip"><b id="co">0</b> online</span>
    <span class="chip"><b id="cv">0</b> viewers</span>
  </div>
</header>

<main>
  <aside>
    <h3>CAMERAS</h3>
    <div id="side"></div>
  </aside>

  <section class="stage">
    <div class="pgmwrap" id="pgmwrap">
      <video id="pgmv" autoplay playsinline muted></video>
      <div id="adlayer" class="hidden"></div>
      <div id="sctile" class="hidden"></div>
      <div class="ph" id="pgmph">CONNECTING…</div>
      <div id="hdr" class="ticker hidden"><div class="track"></div></div>
      <div id="logo" class="hidden"><img id="logoimg" alt=""></div>
      <div class="tag">PROGRAM</div>
      <div id="bottomstack"><div id="ftr" class="ticker hidden"><div class="track"></div></div><div id="lower" class="hidden"></div></div>
    </div>

    <div class="transport">
      <button id="btake" class="go">TAKE ▶</button>
      <button id="bmute" class="blu">UNMUTE</button>
      <button id="bslate">SLATE</button>
      <button id="bbreak">AD BREAK</button>
      <button id="bstop" class="dgr">STOP BREAK</button>
    </div>

    <div class="strip" id="strip"></div>
  </section>

  <aside class="r">
    <div class="tabs">
      <button class="active" data-tab="ads">ADS</button>
      <button data-tab="score">SCORE</button><button data-tab="overlay">OVERLAY</button>
    </div>

    <div id="tab-ads">
      <div id="adlist"></div>
      <hr style="border:none;border-top:1px solid #21262d;margin:10px 0">
      <h3>NEW AD</h3>
      <div class="fld"><label>Title</label><input id="a_title" placeholder="Sponsor name"></div>
      <div class="fld"><label>Kind</label>
        <select id="a_kind"><option value="text">Text card</option><option value="image">Image</option><option value="video">Video</option></select>
      </div>
      <div class="fld"><label>Media URL (image / video)</label><input id="a_url" placeholder="/media/xxx.mp4 or https://…"></div>
      <div class="fld"><label>Or upload file</label><input type="file" id="a_file" accept="video/*,image/*"></div>
      <div class="fld"><label>Text (text card)</label><textarea id="a_text" placeholder="DRINKS BREAK&#10;sponsored by …"></textarea></div>
      <div class="fld"><label>Background</label><input id="a_bg" value="#0b3d91"></div>
      <div class="fld"><label>Duration (sec)</label><input id="a_dur" type="number" value="10" min="1" max="600"></div>
      <button class="btn blu" id="a_add" style="width:100%">ADD AD</button>
    </div>

    <div id="tab-score" class="hidden">
      <div class="sw"><input type="checkbox" id="s_vis"><label for="s_vis" style="margin:0;text-transform:none">Show lower third on air</label></div>
      <div class="fld"><label>Title</label><input id="s_title" placeholder="IND vs AUS · 2nd ODI"></div>
      <div class="fld"><label>Line 1</label><input id="s_l1" placeholder="IND 187/4 (32.1)"></div>
      <div class="fld"><label>Line 2</label><input id="s_l2" placeholder="AUS 250/8 (50.0)"></div>
      <div class="fld"><label>Note</label><input id="s_note" placeholder="IND need 64 runs"></div>
      <button class="btn blu" id="s_save" style="width:100%">UPDATE ON AIR</button>
      <hr style="border:none;border-top:1px solid #21262d;margin:10px 0">
      <button class="btn sec" id="s_hide" style="width:100%">HIDE LOWER THIRD</button>
    </div>

    <div id="tab-overlay" class="hidden">
      <h3 style="margin-top:4px">HEADER TICKER</h3>
      <div class="sw"><input type="checkbox" id="o_h_en"><label for="o_h_en" style="margin:0;text-transform:none">Show header</label></div>
      <div class="fld"><label>Text</label><textarea id="o_h_text" placeholder="WELCOME TO LIVE"></textarea></div>
      <div class="fld"><label>Mode</label><select id="o_h_mode"><option value="scroll">Scrolling</option><option value="static">Static</option></select></div>
      <div class="fld"><label>Background</label><input type="color" id="o_h_bg" value="#b81d1d"></div>
      <div class="fld"><label>Text color</label><input type="color" id="o_h_color" value="#ffffff"></div>
      <div class="fld"><label>Font size (px)</label><input type="number" id="o_h_fs" value="16" min="10" max="40"></div>
      <div class="fld"><label>Speed (sec, lower=faster)</label><input type="number" id="o_h_sp" value="24" min="5" max="120"></div>

      <h3 style="margin-top:12px">FOOTER TICKER</h3>
      <div class="sw"><input type="checkbox" id="o_f_en"><label for="o_f_en" style="margin:0;text-transform:none">Show footer</label></div>
      <div class="fld"><label>Text</label><textarea id="o_f_text" placeholder="SUBSCRIBE · SHARE"></textarea></div>
      <div class="fld"><label>Mode</label><select id="o_f_mode"><option value="scroll">Scrolling</option><option value="static">Static</option></select></div>
      <div class="fld"><label>Position</label><select id="o_f_pos"><option value="above_score">Above score card</option><option value="below_score">Below score card</option></select></div>
      <div class="fld"><label>Background</label><input type="color" id="o_f_bg" value="#0b3d91"></div>
      <div class="fld"><label>Text color</label><input type="color" id="o_f_color" value="#ffffff"></div>
      <div class="fld"><label>Font size (px)</label><input type="number" id="o_f_fs" value="16" min="10" max="40"></div>
      <div class="fld"><label>Speed (sec)</label><input type="number" id="o_f_sp" value="24" min="5" max="120"></div>

      <h3 style="margin-top:12px">CHANNEL LOGO</h3>
      <div class="sw"><input type="checkbox" id="o_l_en"><label for="o_l_en" style="margin:0;text-transform:none">Show logo (top-right)</label></div>
      <div class="fld"><label>Image URL</label><input id="o_l_url" placeholder="/media/xxx.png or https://…"></div>
      <div class="fld"><label>Or upload</label><input type="file" id="o_l_file" accept="image/*"></div>
      <div class="fld"><label>Height (px)</label><input type="number" id="o_l_h" value="60" min="20" max="200"></div>
      <div class="fld"><label>Opacity (0-1)</label><input type="number" id="o_l_op" value="1" min="0" max="1" step="0.1"></div>

      <button class="btn blu" id="o_apply" style="width:100%">APPLY TO AIR</button>
    </div>
  </aside>
</main>

<div id="dbg">booting…</div>

<script>
(function(){
'use strict';
function log(){var a=[].slice.call(arguments);console.log.apply(console,a);document.getElementById('dbg').textContent=a.join(' ');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function gid(){try{if(window.crypto&&crypto.getRandomValues){var a=new Uint8Array(6);crypto.getRandomValues(a);return Array.from(a).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}}catch(e){}return 'o-'+Math.random().toString(36).slice(2)+Date.now().toString(36);}
var myId;try{myId=sessionStorage.getItem('opId2');}catch(e){}
if(!myId){myId=gid();try{sessionStorage.setItem('opId2',myId);}catch(e){}}
var $id=function(x){return document.getElementById(x);};

var since=0, cameras={}, peers={}, pending={}, streams={}, program=null,
    ads=[], score={}, selected=null, fail=0, audioOn=false;

/* ---------- net helpers ---------- */
function setConn(ok){var e=$id('cn');e.textContent=ok?'ONLINE':'CONNECTING…';e.className='badge '+(ok?'ok':'warn');}
function post(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function sig(to,evt,data){return post('/signal',{from:myId,to:to,event:evt,data:data||{}});}

/* ---------- webrtc (operator = viewer of cameras) ---------- */
function closePeer(cid){var e=peers[cid];if(!e)return;
  try{e.pc.onicecandidate=null;e.pc.onconnectionstatechange=null;e.pc.ontrack=null;e.pc.close();}catch(x){}
  delete peers[cid];delete streams[cid];}
function subscribe(cid){
  if(peers[cid]||pending[cid])return;
  var c=cameras[cid];if(!c||c.status!=='online')return;
  pending[cid]=1;setTimeout(function(){delete pending[cid];},5000);
  log('subscribe '+cid);sig(cid,'watch_request',{}).catch(function(){delete pending[cid];});}
function unsubscribe(cid){var e=peers[cid];
  if(e){sig(e.camClientId,'stop_watching',{}).catch(function(){});closePeer(cid);}delete pending[cid];}
function syncPeers(){
  Object.keys(cameras).forEach(function(cid){
    var c=cameras[cid];
    if(c.status==='online'&&!peers[cid])subscribe(cid);
    if(c.status!=='online'&&peers[cid])unsubscribe(cid);});}
function handleOffer(cid,camSid,sdp){
  closePeer(cid);delete pending[cid];
  var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  peers[cid]={pc:pc,camClientId:camSid};
  pc.ontrack=function(ev){if(ev.streams&&ev.streams[0]){streams[cid]=ev.streams[0];log('✓ track '+cid);render();}};
  pc.onicecandidate=function(ev){if(ev.candidate)sig(camSid,'ice',{candidate:ev.candidate});};
  pc.onconnectionstatechange=function(){log('op->'+cid+' '+pc.connectionState);
    if(pc.connectionState==='failed'){closePeer(cid);setTimeout(function(){subscribe(cid);},900);}};
  return pc.setRemoteDescription(new RTCSessionDescription(sdp))
    .then(function(){return pc.createAnswer();})
    .then(function(a){return pc.setLocalDescription(a);})
    .then(function(){return sig(camSid,'answer',{sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});});}

/* ---------- ad / slate rendering ---------- */
function adNode(ad,muted){
  var el;
  if(ad.kind==='video'){el=document.createElement('video');el.src=ad.url;el.autoplay=true;el.playsInline=true;el.muted=!!muted;
    el.onerror=function(){el.replaceWith(txtNode('MEDIA ERROR'));};}
  else if(ad.kind==='image'){el=document.createElement('img');el.src=ad.url;
    el.onerror=function(){el.replaceWith(txtNode('MEDIA ERROR'));};}
  else{el=txtNode(ad.text||ad.title||'AD');el.style.background=ad.bg||'#0b3d91';el.className='adtext';}
  return el;}
function txtNode(t){var d=document.createElement('div');d.className='adtext';d.style.background='#0b3d91';d.textContent=t;return d;}

/* ---------- render ---------- */
function render(){
  renderSide();renderStrip();renderProgram();renderCounts();renderLower();
}
function renderCounts(){
  var a=Object.values(cameras);
  $id('ct').textContent=a.length;
  $id('co').textContent=a.filter(function(c){return c.status==='online';}).length;}
function renderSide(){
  var a=Object.values(cameras).sort(function(x,y){return x.camera_id.localeCompare(y.camera_id);});
  var S=$id('side');S.innerHTML='';
  a.forEach(function(c){
    var r=document.createElement('div');
    var on=program&&program.source==='camera'&&program.camera_id===c.camera_id;
    r.className='row'+(c.camera_id===selected?' sel':'');
    r.innerHTML='<span class="dot '+c.status+'"></span><span class="rid">'+esc(c.camera_id)+'</span>'+
      (on?'<span class="livedot">●</span>':'')+
      (c.name?'<span class="rnm">'+esc(c.name)+'</span>':'');
    r.onclick=function(){selected=c.camera_id;render();};
    r.ondblclick=function(){take(c.camera_id);};
    S.appendChild(r);});}
function renderStrip(){
  var g=$id('strip');
  Array.from(g.children).forEach(function(t){if(!cameras[t.dataset.cid])t.remove();});
  var a=Object.values(cameras).sort(function(x,y){return x.camera_id.localeCompare(y.camera_id);});
  a.forEach(function(c){
    var t=g.querySelector('[data-cid="'+c.camera_id+'"]');
    if(!t){t=document.createElement('div');t.className='tile';t.dataset.cid=c.camera_id;
      t.innerHTML='<video autoplay playsinline muted></video><div class="ph">'+esc(c.camera_id)+'</div><div class="tl"></div>';
      t.onclick=function(){selected=c.camera_id;render();};
      t.ondblclick=function(){take(c.camera_id);};
      g.appendChild(t);}
    var v=t.querySelector('video'),ph=t.querySelector('.ph');
    if(streams[c.camera_id]){if(v.srcObject!==streams[c.camera_id])v.srcObject=streams[c.camera_id];
      ph.style.display='none';t.classList.add('live');}
    else{ph.style.display='flex';t.classList.remove('live');}
    t.classList.toggle('sel',c.camera_id===selected);
    t.querySelector('.tl').textContent=c.camera_id+(c.name?' · '+c.name:'');});}
function renderProgram(){
  var p=program;if(!p)return;
  var pv=$id('pgmv'),ad=$id('adlayer'),sc=$id('sctile'),ph=$id('pgmph');

  var _wa=(p.source==='ad'&&p.ad)?(p.ad.id||''):'';
  if(ad.dataset.adid!==_wa){
    var oldAdV=ad.querySelector('video');
    if(oldAdV){try{oldAdV.pause();oldAdV.removeAttribute('src');oldAdV.load();}catch(e){}}
    ad.innerHTML='';
    if(_wa)ad.appendChild(adNode(p.ad||{}));
    ad.dataset.adid=_wa;
  }
  ad.classList.toggle('hidden',!_wa);
  sc.classList.add('hidden');
  ph.style.display='none';

  pv.style.display='block';
  pv.style.visibility='visible';

  if(p.source==='camera'){
    var s=streams[p.camera_id];
    if(s){
      if(pv.srcObject!==s){pv.srcObject=s;try{pv.play();}catch(e){}}
      pv.style.opacity='1';
    }else{
      pv.style.opacity='0';
      ph.style.display='flex';
      ph.textContent='CONNECTING · '+p.camera_id;
    }
  }else if(p.source==='ad'){
    pv.style.opacity='0';
  }else{
    pv.style.opacity='0';
    sc.classList.remove('hidden');
    sc.textContent=p.title||'STANDBY';
  }
  $id('oans').textContent=p.source==='camera'?(p.title||p.camera_id)
      :p.source==='ad'?('AD · '+(p.title||'')):(p.title||'SLATE');}
function renderLower(){
  var L=$id('lower');
  if(!score.visible||!(score.title||score.line1||score.line2)){L.classList.add('hidden');return;}
  L.classList.remove('hidden');
  L.innerHTML=(score.title?'<div class="lt">'+esc(score.title)+'</div>':'')+
    '<div class="lbody">'+
    (score.line1?'<span class="l1">'+esc(score.line1)+'</span>':'')+
    (score.line2?'<span class="l2">'+esc(score.line2)+'</span>':'')+
    (score.note?'<span class="ln">'+esc(score.note)+'</span>':'')+'</div>';}

/* ---------- director actions ---------- */
function take(cid){if(!cid)return;
  post('/api/take',{camera_id:cid}).then(function(r){
    if(!r.ok)log('take failed: '+r.error);else log('TAKE '+cid);});}
function renderAds(){
  var L=$id('adlist');L.innerHTML='';
  if(!ads.length){L.innerHTML='<div style="font-size:11px;color:#6e7681;padding:6px">No ads yet.</div>';return;}
  ads.forEach(function(a){
    var d=document.createElement('div');d.className='adrow';
    d.innerHTML='<input type="checkbox" class="adck" data-id="'+esc(a.id)+'" checked>'+
      '<span class="adt" title="'+esc(a.title)+'">'+esc(a.title)+'</span>'+
      '<span class="adk">'+esc(a.kind)+' '+(a.duration||0)+'s</span>';
    var b1=document.createElement('button');b1.textContent='PLAY';
    b1.onclick=function(){post('/api/ad/play',{ad_id:a.id});};
    var b2=document.createElement('button');b2.textContent='DEL';b2.className='dgr';
    b2.onclick=function(){fetch('/api/ads/'+encodeURIComponent(a.id),{method:'DELETE'})
      .then(function(){refreshState();});};
    d.appendChild(b1);d.appendChild(b2);L.appendChild(d);});}

/* ---------- events ---------- */
var _ovInit=false;
function syncOverlayUI(o){
  if(_ovInit||!o)return;_ovInit=true;
  if(o.header){$id('o_h_en').checked=!!o.header.enabled;$id('o_h_text').value=o.header.text||'';
    $id('o_h_mode').value=o.header.mode||'scroll';$id('o_h_bg').value=o.header.bg||'#b81d1d';
    $id('o_h_color').value=o.header.color||'#ffffff';$id('o_h_fs').value=o.header.font_size||16;
    $id('o_h_sp').value=o.header.speed||24;}
  if(o.footer){$id('o_f_en').checked=!!o.footer.enabled;$id('o_f_text').value=o.footer.text||'';
    $id('o_f_mode').value=o.footer.mode||'scroll';$id('o_f_pos').value=o.footer.position||'above_score';
    $id('o_f_bg').value=o.footer.bg||'#0b3d91';$id('o_f_color').value=o.footer.color||'#ffffff';
    $id('o_f_fs').value=o.footer.font_size||16;$id('o_f_sp').value=o.footer.speed||24;}
  if(o.logo){$id('o_l_en').checked=!!o.logo.enabled;$id('o_l_url').value=o.logo.url||'';
    $id('o_l_h').value=o.logo.height||60;$id('o_l_op').value=(o.logo.opacity!=null?o.logo.opacity:1);}
}
function applyOverlay(o){
  if(!o)return; syncOverlayUI(o);
  var H=$id('hdr'),F=$id('ftr'),L=$id('logo'),LI=$id('logoimg'),BS=$id('bottomstack');
  if(o.header&&o.header.enabled&&o.header.text){
    H.classList.remove('hidden');
    H.classList.toggle('scroll',(o.header.mode||'scroll')==='scroll');
    H.classList.toggle('static',(o.header.mode||'scroll')!=='scroll');
    H.style.background=o.header.bg||'#b81d1d';H.style.color=o.header.color||'#fff';
    H.style.fontSize=(o.header.font_size||16)+'px';
    var t=H.querySelector('.track');t.textContent=o.header.text;
    t.style.animationDuration=((o.header.speed||24))+'s';
  }else H.classList.add('hidden');
  if(o.footer)BS.classList.toggle('pos-below_score',o.footer.position==='below_score');
  if(o.footer&&o.footer.enabled&&o.footer.text){
    F.classList.remove('hidden');
    F.classList.toggle('scroll',(o.footer.mode||'scroll')==='scroll');
    F.classList.toggle('static',(o.footer.mode||'scroll')!=='scroll');
    F.style.background=o.footer.bg||'#0b3d91';F.style.color=o.footer.color||'#fff';
    F.style.fontSize=(o.footer.font_size||16)+'px';
    var t2=F.querySelector('.track');t2.textContent=o.footer.text;
    t2.style.animationDuration=((o.footer.speed||24))+'s';
  }else F.classList.add('hidden');
  if(o.logo&&o.logo.enabled&&o.logo.url){
    L.classList.remove('hidden');
    if(LI.src.indexOf(o.logo.url)<0)LI.src=o.logo.url;
    LI.style.height=(o.logo.height||60)+'px';
    LI.style.opacity=(o.logo.opacity!=null?o.logo.opacity:1);
  }else L.classList.add('hidden');
}
function handle(e){
  var evt=e.evt,d=e.data;
  if(evt==='program'){program=d;render();}
  else if(evt==='score'){score=d;renderLower();}
  else if(evt==='overlay'){applyOverlay(d);}
  else if(evt==='camera_status'){
    if(!cameras[d.camera_id])cameras[d.camera_id]={camera_id:d.camera_id,status:d.status};
    else cameras[d.camera_id].status=d.status;
    if(d.name)cameras[d.camera_id].name=d.name;
    if(d.status!=='online'&&peers[d.camera_id])unsubscribe(d.camera_id);
    syncPeers();render();}
  else if(evt==='offer'){
    if(!d.camera_id){log('offer without camera_id');return;}
    handleOffer(d.camera_id,d.from,d.sdp).catch(function(x){log('offer err '+x.message);});}
  else if(evt==='ice'){
    if(!d.camera_id)return;var p=peers[d.camera_id];
    if(!p||!d.candidate)return;
    p.pc.addIceCandidate(new RTCIceCandidate(d.candidate)).catch(function(){});}
}

/* ---------- poll loop ---------- */
function refreshState(){
  fetch('/api/state').then(function(r){return r.json();}).then(function(d){
    program=d.program;score=d.score;ads=d.ads;renderAds();render();});}

function loop(){
  fetch('/poll?id='+encodeURIComponent(myId)+'&since='+since+'&role=director',{cache:'no-store'})
  .then(function(r){return r.json();})
  .then(function(d){
    since=d.since||0;
    (d.cameras||[]).forEach(function(c){
      if(!cameras[c.camera_id])cameras[c.camera_id]={camera_id:c.camera_id,status:c.status,name:c.name};
      else{cameras[c.camera_id].status=c.status;if(c.name)cameras[c.camera_id].name=c.name;}});
    (d.events||[]).forEach(handle);
    if(d.program)program=d.program;
    if(d.score)score=d.score;
    if(d.overlay)applyOverlay(d.overlay);
    if(d.ads)ads=d.ads;
    $id('cv').textContent=d.viewers||0;
    syncPeers();renderAds();render();
    fail=0;setConn(true);
  })
  .catch(function(e){fail++;log('poll err '+fail);if(fail>=3)setConn(false);})
  .then(function(){setTimeout(loop,400);});}

/* ---------- UI wiring ---------- */
$id('btake').onclick=function(){if(selected)take(selected);else log('select a camera first');};
$id('bmute').onclick=function(){audioOn=!audioOn;$id('pgmv').muted=!audioOn;
  $id('bmute').textContent=audioOn?'MUTE':'UNMUTE';
  if(audioOn)$id('pgmv').play().catch(function(){});};
$id('bslate').onclick=function(){var t=prompt('Slate text:','STANDBY');if(t!==null)post('/api/slate',{title:t});};
$id('bbreak').onclick=function(){
  var ids=Array.from(document.querySelectorAll('.adck')).filter(function(c){return c.checked;})
    .map(function(c){return c.dataset.id;});
  if(!ids.length){log('no ads selected');return;}
  post('/api/break/start',{ids:ids}).then(function(r){log(r.ok?'break started':'break err '+r.error);});};
$id('bstop').onclick=function(){post('/api/break/stop',{}).then(function(r){log(r.ok?'break stopped':'no break');});};

$id('a_add').onclick=function(){
  var body={title:$id('a_title').value,kind:$id('a_kind').value,url:$id('a_url').value,
            text:$id('a_text').value,bg:$id('a_bg').value,duration:$id('a_dur').value};
  post('/api/ads',body).then(function(r){
    if(!r.ok){log('ad add failed: '+r.error);return;}
    $id('a_title').value='';$id('a_url').value='';$id('a_text').value='';
    refreshState();});};
$id('a_file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var fd=new FormData();fd.append('file',f);
  fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();})
    .then(function(j){if(j.ok){$id('a_url').value=j.url;
      $id('a_kind').value=/\.(mp4|webm|ogv)$/i.test(j.url)?'video':'image';
      if(!$id('a_title').value)$id('a_title').value=f.name;
      log('uploaded '+j.url);}else log('upload failed: '+j.error);});};

$id('s_save').onclick=function(){
  post('/api/score',{visible:$id('s_vis').checked,title:$id('s_title').value,
    line1:$id('s_l1').value,line2:$id('s_l2').value,note:$id('s_note').value});};
$id('s_hide').onclick=function(){$id('s_vis').checked=false;post('/api/score',{visible:false});};
['s_title','s_l1','s_l2','s_note'].forEach(function(id){
  $id(id).addEventListener('input',function(){
    post('/api/score',{visible:$id('s_vis').checked,title:$id('s_title').value,
      line1:$id('s_l1').value,line2:$id('s_l2').value,note:$id('s_note').value});});});
$id('s_vis').onchange=function(){post('/api/score',{visible:$id('s_vis').checked});};

function pushOverlay(){
  var ov={
    header:{enabled:$id('o_h_en').checked,text:$id('o_h_text').value,mode:$id('o_h_mode').value,
            bg:$id('o_h_bg').value,color:$id('o_h_color').value,
            font_size:parseInt($id('o_h_fs').value)||16,speed:parseInt($id('o_h_sp').value)||24},
    footer:{enabled:$id('o_f_en').checked,text:$id('o_f_text').value,mode:$id('o_f_mode').value,
            position:$id('o_f_pos').value,bg:$id('o_f_bg').value,color:$id('o_f_color').value,
            font_size:parseInt($id('o_f_fs').value)||16,speed:parseInt($id('o_f_sp').value)||24},
    logo:{enabled:$id('o_l_en').checked,url:$id('o_l_url').value,
          height:parseInt($id('o_l_h').value)||60,opacity:parseFloat($id('o_l_op').value)||1}
  };
  post('/api/overlay',ov).then(function(r){log(r.ok?'overlay updated':'overlay err');});
}
$id('o_apply').onclick=pushOverlay;
$id('o_l_file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var fd=new FormData();fd.append('file',f);
  fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();})
    .then(function(j){if(j.ok){$id('o_l_url').value=j.url;$id('o_l_en').checked=true;pushOverlay();log('logo uploaded');}
      else log('upload failed: '+j.error);});};
document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    $id('tab-ads').classList.toggle('hidden',b.dataset.tab!=='ads');
    $id('tab-score').classList.toggle('hidden',b.dataset.tab!=='score');
    $id('tab-overlay').classList.toggle('hidden',b.dataset.tab!=='overlay');};});

window.addEventListener('beforeunload',function(){
  Object.keys(peers).forEach(function(cid){var e=peers[cid];if(e)sig(e.camClientId,'stop_watching',{});closePeer(cid);});});

log('starting id='+myId);
refreshState();loop();
})();
</script></body></html>
